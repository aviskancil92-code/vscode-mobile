name: Build VS Code Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.4'
  JAVA_VERSION: '17'
  CODE_SERVER_VERSION: '4.103.1'
  ANDROID_NDK_VERSION: '25.1.8937393'
  CODE_LFA_REPO: 'https://github.com/nightmare-space/code_lfa.git'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Clone Code FA
        run: |
          git clone --depth 1 ${{ env.CODE_LFA_REPO }} code_lfa
          cd code_lfa
          test -f pubspec.yaml || { echo "FATAL: pubspec.yaml tidak ada"; exit 1; }
          echo "OK: proyek Code FA ter-clone"
          ls -la

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Verify Flutter and Dart
        run: |
          flutter --version
          dart --version
          flutter config --no-analytics
          flutter config --no-cli-animations

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: ''

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          set -e
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clean stale files
        working-directory: code_lfa
        run: |
          rm -f pubspec.lock pubspec_overrides.yaml .packages .flutter-plugins .flutter-plugins-dependencies
          rm -rf .dart_tool build
          echo "OK: file usang dibersihkan"

      - name: Flutter pub get
        working-directory: code_lfa
        run: |
          set -e
          flutter clean
          flutter pub get
          test -f .dart_tool/package_config.json || { echo "FATAL: package_config.json tidak dibuat"; exit 1; }
          echo "OK: dependensi ter-resolve"

      - name: Download code-server
        working-directory: code_lfa
        run: |
          set -e
          mkdir -p assets/code-server
          curl -fL --retry 3 --retry-delay 5 \
            -o assets/code-server/code-server-${{ env.CODE_SERVER_VERSION }}-linux-arm64.tar.gz \
            "https://github.com/coder/code-server/releases/download/v${{ env.CODE_SERVER_VERSION }}/code-server-${{ env.CODE_SERVER_VERSION }}-linux-arm64.tar.gz"
          ls -la assets/code-server/
          test -s assets/code-server/code-server-${{ env.CODE_SERVER_VERSION }}-linux-arm64.tar.gz || { echo "FATAL: code-server tidak terunduh"; exit 1; }
          echo "OK: code-server terunduh"

      # ── BUILD: coba beberapa varian, tapi jangan telan error ──
      - name: Build APK (release, split-per-abi)
        id: build_release
        working-directory: code_lfa
        continue-on-error: true
        run: flutter build apk --release --split-per-abi

      - name: Build APK (release, universal) - fallback 1
        id: build_universal
        if: steps.build_release.outcome == 'failure'
        working-directory: code_lfa
        continue-on-error: true
        run: |
          echo "Release split gagal, coba universal..."
          flutter build apk --release

      - name: Build APK (debug) - fallback 2
        id: build_debug
        if: steps.build_release.outcome == 'failure' && steps.build_universal.outcome == 'failure'
        working-directory: code_lfa
        continue-on-error: true
        run: |
          echo "Release universal gagal, coba debug..."
          flutter build apk --debug

      # ── DIAGNOSTIK: kalau semua gagal, cetak log lengkap ──
      - name: Diagnose build failure
        if: steps.build_release.outcome == 'failure' && steps.build_universal.outcome == 'failure' && steps.build_debug.outcome == 'failure'
        working-directory: code_lfa
        run: |
          echo "=========================================="
          echo "SEMUA BUILD GAGAL - MENAMPILKAN DIAGNOSTIK"
          echo "=========================================="
          echo "--- flutter doctor -v ---"
          flutter doctor -v || true
          echo "--- flutter pub deps (ringkas) ---"
          flutter pub deps --style=compact 2>&1 | head -50 || true
          echo "--- Android SDK ---"
          ls -la $ANDROID_HOME/ || true
          echo "--- NDK ---"
          ls -la $ANDROID_HOME/ndk/ || true
          echo "--- Struktur folder build ---"
          find build -maxdepth 4 -type d 2>/dev/null || echo "Tidak ada folder build/"
          echo "--- File APK yang ada (jika ada) ---"
          find build -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # ── VERIFIKASI: pastikan APK benar-benar ada ──
      - name: Verify APK exists
        id: verify_apk
        working-directory: code_lfa
        run: |
          echo "=== Mencari file APK ==="
          APK_COUNT=$(find build/app/outputs -name "*.apk" 2>/dev/null | wc -l)
          echo "Jumlah APK ditemukan: $APK_COUNT"
          find build/app/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null || true
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "FATAL: Tidak ada APK yang dihasilkan. Build gagal."
            exit 1
          fi
          echo "OK: APK ditemukan"

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-android-apk
          path: |
            code_lfa/build/app/outputs/flutter-apk/*.apk
            code_lfa/build/app/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            code_lfa/android/.gradle/**
            code_lfa/build/**
          retention-days: 7
          if-no-files-found: ignore
