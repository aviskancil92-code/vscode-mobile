name: Build VS Code Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'
  CODE_SERVER_VERSION: '4.103.1'
  ANDROID_NDK_VERSION: '25.1.8937393'
  CODE_LFA_REPO: 'https://github.com/nightmare-space/code_lfa.git'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Clone Code FA (Flutter project)
        run: |
          git clone --depth 1 ${{ env.CODE_LFA_REPO }} code_lfa
          cd code_lfa
          echo "=== Struktur proyek ==="
          ls -la
          echo "=== Cek pubspec.yaml ==="
          test -f pubspec.yaml && echo "pubspec.yaml DITEMUKAN" || (echo "pubspec.yaml TIDAK ADA" && exit 1)

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: ''

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # =========================================================
      # LANGKAH KRUSIAL: Hapus pubspec.lock DAN pubspec_overrides.yaml
      # =========================================================
      - name: Clean Flutter project and install dependencies
        working-directory: code_lfa
        run: |
          echo "=== Menghapus file usang yang berisi path absolut ==="
          rm -f pubspec.lock pubspec_overrides.yaml .packages .flutter-plugins .flutter-plugins-dependencies
          rm -rf .dart_tool build
          echo "=== Menjalankan flutter clean ==="
          flutter clean
          flutter config --no-analytics
          echo "=== Menjalankan flutter pub get ==="
          flutter pub get

      - name: Download code-server
        working-directory: code_lfa
        run: |
          mkdir -p assets/code-server
          curl -L -o assets/code-server/code-server-${{ env.CODE_SERVER_VERSION }}-linux-arm64.tar.gz \
            "https://github.com/coder/code-server/releases/download/v${{ env.CODE_SERVER_VERSION }}/code-server-${{ env.CODE_SERVER_VERSION }}-linux-arm64.tar.gz"
          ls -la assets/code-server/

      - name: Build APK (release)
        working-directory: code_lfa
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vscode-android-apk
          path: code_lfa/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
